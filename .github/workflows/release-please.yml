name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: '@aiostreams/release-parser'
      
      # Publish to npm when a release is created
      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}
      
      - name: Install corepack
        run: corepack enable
      
      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: 24
      
      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm install
      
      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: pnpm build
      
      # Trusted publishing through id-token, so no token; it needs the npm CLI, not pnpm.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --access public
